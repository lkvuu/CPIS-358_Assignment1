<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <!-- التدرج الأزرق لسيارة التأجير -->
    <linearGradient id="carBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0288d1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#01579b;stop-opacity:1" />
    </linearGradient>

    <!-- التدرج البرتقالي لتفاصيل السرعة -->
    <linearGradient id="speedOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f57c00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- الجزء العلوي: رسمة السيارة وأسفلها خط الطريق -->
  <g id="car-icon" transform="translate(45, 10)">
    <!-- خط الجرافيك الديناميكي للطريق -->
    <path d="M 10,105 Q 155,100 300,105" stroke="url(#speedOrange)" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- هيكل السيارة الجديد الواضح (Sedan/Coupe Silhouette) -->
    <path d="M 25,95 
             C 30,85 45,80 65,80 
             L 100,80 
             C 125,50 155,45 200,45 
             L 230,45 
             C 255,55 270,70 280,82 
             L 285,88 
             C 295,90 295,95 285,95 
             Z" 
          fill="url(#carBlue)"/>

    <!-- نوافذ السيارة -->
    <path d="M 110,73 
             C 130,53 150,52 195,52 
             L 195,73 
             Z" 
          fill="#ffffff" opacity="0.85"/>
    <path d="M 202,52 
             L 225,52 
             C 245,63 252,73 255,73 
             L 202,73 
             Z" 
          fill="#ffffff" opacity="0.85"/>

    <!-- العجلات والإطارات -->
    <!-- العجلة الخلفية -->
    <circle cx="85" cy="95" r="18" fill="#212121" stroke="#ffffff" stroke-width="3"/>
    <circle cx="85" cy="95" r="8" fill="url(#speedOrange)"/>
    
    <!-- العجلة الأمامية -->
    <circle cx="235" cy="95" r="18" fill="#212121" stroke="#ffffff" stroke-width="3"/>
    <circle cx="235" cy="95" r="8" fill="url(#speedOrange)"/>
  </g>

  <!-- الجزء السفلي: اسم الشركة تحت السيارة ممركز في المنتصف -->
  <g id="brand-text">
    <!-- اسم مسار بالعربي -->
    <text x="200" y="155" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="38" font-weight="bold" fill="#01579b" text-anchor="middle">مَسَار</text>

    <!-- النص الإنجليزي والوصف -->
    <text x="200" y="182" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="14" font-weight="600" fill="#f57c00" letter-spacing="3" text-anchor="middle">MASAR CAR RENTAL</text>
  </g>
</svg>
